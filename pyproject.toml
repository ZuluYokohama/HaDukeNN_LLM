[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheaf-verify"
version = "0.1.0"
description = "Private research-verification harness for hypergraph and sheaf language-model studies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Blake Jones"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sheaf-verify = "sheaf_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
